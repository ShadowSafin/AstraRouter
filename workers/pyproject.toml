[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corerouter-workers"
version = "1.0.0"
description = "CoreRouter intelligence workers: evaluation, prompt analysis and telemetry rollups"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Dependencies are split by role because the core library deliberately needs
# nothing. `bus` pulls in the messaging client, `judge` the HTTP client, and
# `metrics` the Prometheus exporter. Installing only what a deployment uses keeps
# the image small and the supply chain short.
dependencies = [
  "nats-py>=2.6,<3",
  "httpx>=0.27,<1",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
# PyYAML is optional: a deployment that cannot install it still has JSON config.
yaml = ["PyYAML>=6.0,<7"]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
corerouter-worker = "corerouter_workers.cli:main"

[project.urls]
Homepage = "https://github.com/corerouter/corerouter"
Documentation = "https://github.com/corerouter/corerouter/blob/main/docs/architecture.md"

[tool.setuptools]
packages = ["corerouter_workers"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  # Long log format strings and docstring URLs are clearer unwrapped.
  "E501",
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
# The transport modules import their third-party dependency lazily, so the stubs
# are only needed when those modules are actually type-checked in a full install.
ignore_missing_imports = true
